<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Nested Table</title>
  </head>
  <body>
    <table border="">
      <caption>
        Student Details
      </caption>
      <tr>
        <th>Name</th>
        <th>Id</th>
        <th>Course</th>
        <th>Contact</th>
      </tr>
      <tr>
        <td>John Doe</td>
        <td>1001</td>
        <td>
          MERN Stack
          <ul>
            <li>Mongo</li>
            <li>Express</li>
            <li>React</li>
            <li>Node</li>
          </ul>
        </td>
        <td>john@email.com</td>
      </tr>
      <tr>
        <td>Jack Smith</td>
        <td>1002</td>
        <td>
          Java Full Stack
          <table border="1">
            <tr>
              <th>Frontend</th>
              <th>Backend</th>
              <th>Database</th>
            </tr>
            <tr>
              <td>HTML, CSS</td>
              <td>Java</td>
              <td>MySQL</td>
            </tr>
            <tr>
              <td>ReactJS</td>
              <td>Spring</td>
              <td></td>
            </tr>
          </table>
        </td>
        <td>jack@email.com</td>
      </tr>
      <tr>
        <td>Emily</td>
        <td>1006</td>
        <td>Python Full Stack</td>
        <td>emily@email.com</td>
      </tr>
    </table>
  </body>
</html>
