<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia in HTML</title>
</head>
<body>
    <h1>Introduction to multimedia in HTML</h1>
    <h2>Image</h2>
    <h3>Image from same folder</h3>
    <img src="image1.avif" alt="image" height="250px" width="380px">
    <img src="image2.avif" alt="image" height="250px" width="300px">
    <hr>
    <h3>Image from another folder</h3>
    <img src="images/image3.avif" alt="image"  height="250px" width="300px">
    <img src="images/image4.avif" alt="image"  height="250px" width="300px">
    <hr>
    <h3>Image from Browser</h3>
    <img src="https://images.unsplash.com/photo-1786886351097-cf96d8cbb4d4?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwzMTF8fHxlbnwwfHx8fHw%3D" alt="image" height="250px" width="300px">
    <img src="https://images.unsplash.com/photo-1786967626353-dc7ea65a4a67?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwzNjB8fHxlbnwwfHx8fHw%3D" alt="image" height="250px" width="300px">
    <hr>
    <h3>Image form PC</h3>
    <img src="C:\Users\Zoltain\Downloads\image1.avif" alt="image" height="400px" width="300px">
    <img src="C:\Users\Zoltain\Downloads\image2.avif" alt="image" height="400px" width="300px">
    <hr>
    <h3>Video</h3>
    <video src="images/video.mp4" controls height="400px" width="300px"></video>
    <hr>
    <h3>Audio</h3>
    <audio src="images/audio.mp3" controls height="400px" width="300px"></audio>
    <hr>
    <h3>PDF</h3>
    <embed src="1_Front_End_Basics.pdf" type="application/pdf" height="400px" width="300px">
    <hr>
    <h3>YouTube video</h3>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/5Eqb_-j3FDA?si=QLMJKUlfu2vbsoUG" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
