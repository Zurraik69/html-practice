<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Department Matrix</title>
</head>
<body>

    <table border="1">
        <caption>
            <b>Employee Department Matrix</b>
        </caption>

        <tr>
            <th rowspan="2">Department</th>
            <th rowspan="2">Team</th>
            <th colspan="3">Employees</th>
        </tr>

        <tr>
            <th>Name</th>
            <th>Role</th>
            <th>Experience</th>
        </tr>

        <tr>
            <td rowspan="4">Development</td>
            <td rowspan="2">Frontend</td>
            <td>Alice</td>
            <td>UI Developer</td>
            <td>3 Years</td>
        </tr>

        <tr>
            <td>Bob</td>
            <td>React Dev</td>
            <td>2 Years</td>
        </tr>

        <tr>
            <td rowspan="2">Backend</td>
            <td>Charlie</td>
            <td>Node.js Dev</td>
            <td>4 Years</td>
        </tr>

        <tr>
            <td>David</td>
            <td>Java Dev</td>
            <td>5 Years</td>
        </tr>

        <tr>
            <td rowspan="2">Marketing</td>
            <td>Digital</td>
            <td>Eva</td>
            <td>SEO</td>
            <td>2 Years</td>
        </tr>

        <tr>
            <td>Offline</td>
            <td>Frank</td>
            <td>Brand Manager</td>
            <td>6 Years</td>
        </tr>

    </table>

</body>
</html>
