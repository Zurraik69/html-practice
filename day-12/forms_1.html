<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms in HTML</title>
  </head>
  <body>
    <form>
      <h1>Registration Form</h1>
      <label for="fname">First Name:</label>
      <input type="text" id="fname" placeholder="Enter First Name" required />
      <br />
      <label for="lname">Last Name:</label>
      <input type="text" id="lname" placeholder="Enter Last Name" required/>
      <br />
      <label for="email">Email:</label>
      <input type="email" id="email" placeholder="Enter Email Address" />
      <br />
      <label for="password">Password:</label>
      <input type="password" id="password" />
      <br />
      <label>Gender:</label>
      <br />
      <label for="man">Man</label> <input type="radio" id="man" name="gender" />
      <br />
      <label for="female">Female</label>
      <input type="radio" id="female" name="gender" />
      <br />
      <label for="other">Other</label>
      <input type="radio" id="other" name="gender" />
      <br />
      <label for="age">Age:</label>
      <input type="number" />
      <br />
      <label>Preferences:</label>
      <br />
      <label for="acrylic painting">Acrylic Painting</label>
      <input type="checkbox" id="acrylic painting" />
      <br />
      <label for="oil painting">Oil Painting</label>
      <input type="checkbox" id="oil painting" />
      <br />
      <label for="water color painting">Water Color Painting</label>
      <input type="checkbox" id="water color painting" />
      <br />
      <label>Select Ocupation:</label>
      <select>
        <option>Student</option>
        <option>Professor</option>
        <option>Guards</option>
      </select>
      <br />
      <label for="textarea">Bio</label>
      <textarea
        id="textarea"
        placeholder="Share few lines about yourself..." cols="30" rows="5"
      ></textarea>
      <br>
      <input type="reset">
      <input type="submit">
    </form>
  </body>
</html>
