<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms in HTML</title>
  </head>
  <body>
    <form>
      <fieldset>
        <legend>Employee Details</legend>
        <label for="username">Username</label>
        <br />
        <input
          type="text"
          id="username"
          placeholder="Enter Username"
          required
        />
        <br /><br />
        <label for="password">Password</label><br />
        <input
          type="password"
          id="password"
          placeholder="Enter Password"
          required
        />
        <br /><br />
        <label for="email">Email Id</label><br />
        <input type="email" id="email" placeholder="Enter Email" />
        <br /><br />
        <label for="">Select Gender</label><br />
        <input type="radio" id="male" name="gender" />
        <label for="male">Male</label><br />
        <input type="radio" id="female" name="gender" />
        <label for="female">Female</label><br />
        <input type="radio" id="other" name="gender" />
        <label for="other">Other</label> <br /><br />
        <label for="">Skills</label><br />
        <input type="checkbox" id="java" /> <label for="java">Java</label><br />
        <input type="checkbox" id="python" /> <label for="python">Python</label
        ><br />
        <input type="checkbox" id="ai" /> <label for="ai">AI</label><br />
        <input type="checkbox" id="automation" />
        <label for="automation">Automation</label>
        <br /><br />
        <label for="">Complete Address</label><br />
        <textarea
          name=""
          id=""
          placeholder="Enter permanent address"
          rows="4"
          cols="25"
        ></textarea>
        <br /><br />
        <input type="reset" />
        <input type="submit" />
      </fieldset>
    </form>
  </body>
</html>
