<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms in HTML</title>
  </head>
  <body>
    <form>
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Enter Username" required />
      <br />
      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter Password"
        required
      />
      <br />
      <label for="email">Email Id</label>
      <input type="email" id="email" placeholder="Enter Email" />
      <br />
      <label for="date">D.O.B</label>
      <input type="date" id="date" max="2026-09-01" min="2002-12-31"/>
      <br />
      <br />
      <label for="text">Mobile No...</label>
      <input type="text" value="+91" size="1" readonly />
      <input type="number" /> <br /><br />
      <label for="number">Age..</label>
      <input type="number" id="number" min="18" max="50" />
      <br />
      <input type="submit" />
    </form>
    <hr />

    <table>
      <form action="">
        <tr>
          <td><label for="">First Name</label></td>
          <td><input type="text" /></td>
        </tr>
        <tr>
          <td><label for="">Last Name</label></td>
          <td><input type="text" /></td>
        </tr>
        <tr>
          <td><label for="">Employee Number</label></td>
          <td><input type="text" /></td>
        </tr>
        <tr>
          <td><label for="">Employement Type</label></td>
          <td><input type="text" /></td>
        </tr>
        <tr>
          <td><label for="">Designation</label></td>
          <td><input type="text" /></td>
        </tr>
        <tr>
          <td><label for="">Salary</label></td>
          <td><input type="text" /></td>
        </tr>
      </form>
    </table>
  </body>
</html>
