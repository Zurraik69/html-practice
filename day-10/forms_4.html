<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms in HTML</title>
  </head>
  <body>
    <form action="">
      <h1>Registration Form</h1>
      <label for="fname"><b>First Name : </b></label>
      <input type="text" placeholder="Enter First Name" id="fname" />
      <br />
      <label for="lname"><b>Last Name : </b></label>
      <input type="text" placeholder="Enter Last Name" id="lname" />
      <br />
      <label for="email"><b>Email : </b></label>
      <input type="email" placeholder="Enter Email Address" id="email" />
      <br />
      <label for="password"><b>Password : </b></label>
      <input type="password" id="password" />
      <br />
      <label for=""><b>Gender:</b></label> <br />
      <label for="male" name="gender"><b>Male</b></label> <input type="radio" id="male" />
      <br />
      <label for="female" name="gender"><b>Female</b></label>
      <input type="radio" id="female" />
      <br />
      <label for="other" name="gender"><b>Other</b></label> <input type="radio" id="other" />
      <br>
      <label for="age"><b>Age :</b></label>
      <input type="number" id="age">
      <br>
      <label for=""><b>Preferences :</b></label> <br>
       <label for=""><b>Acrylic Painting</b></label> <input type="checkbox"> <br>
       <label for=""><b>Oil Painting</b></label> <input type="checkbox"> <br>
       <label for=""><b>Water Color Painting</b></label> <input type="checkbox">
       <br>
       <label for=""><b>Select Occupation</b></label>
       <select name="" id="">
        <option selected>Student</option>
        <option >Professor</option>
       </select>
       <br>
       <label for=""><b>Bio</b></label>
       <textarea name="" id="" placeholder="Share fev line about yourself..." rows="5" cols="35"></textarea>
       <br>
       <button type="reset">RESET</button>
       <button type="submit">SUBMIT</button>
    </form>
  </body>
</html>
